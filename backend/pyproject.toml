[project]
name = "lineage-backend"
version = "0.1.0"
description = "任务血缘管理工具后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "neo4j>=5.18",
    "email-validator>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[mysql]>=4.0",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
env = [
    "DOCKER_HOST=unix:///Users/zyc/.docker/run/docker.sock",
    "TESTCONTAINERS_RYUK_DISABLED=true",
    "TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/Users/zyc/.docker/run/docker.sock",
]

[tool.ruff]
line-length = 100
target-version = "py310"
